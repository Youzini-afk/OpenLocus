[workspace]
members = [
    "crates/openlocus",
    "crates/openlocus-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Youzini-afk/OpenLocus"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tantivy = "0.25"
tempfile = "3.23"
toml = "0.9"
